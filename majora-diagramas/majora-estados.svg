<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" role="img" aria-labelledby="t d">
<title id="t">Máscara de Majora interactiva: diagrama de estados</title>
<desc id="d">Estados DORMIDA, DESPERTAR, POSESIÓN y CALMA según la distancia medida por el sensor HC-SR04, con la rama de lectura inválida y los pines del ESP32.</desc>
<defs>
<filter id="aspero" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="r"/><feDisplacementMap in="SourceGraphic" in2="r" scale="4"/></filter>
<filter id="ruido" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/><feColorMatrix type="saturate" values="0"/></filter>
<marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/></marker>
</defs>
<rect width="1200" height="920" fill="#0d0d0d"/>
<rect width="1200" height="920" filter="url(#ruido)" opacity="0.12"/>
<polygon points="0,18 1200,0 1200,22 0,40" fill="#ff6a00" opacity="0.85"/>
<text x="60" y="95" font-family="Impact, Arial Black, sans-serif" font-size="46" fill="#ff6a00" letter-spacing="2">MÁSCARA DE MAJORA INTERACTIVA</text>
<text x="60" y="130" font-family="Courier New, monospace" font-size="18" fill="#8a8a8a">Máquina de estados · ESP32 + HC-SR04 + 2 servos de 180°</text>
<g filter="url(#aspero)">
<rect x="60" y="170" width="300" height="200" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="4"/>
<rect x="60" y="170" width="300" height="8" fill="#8a8a8a"/>
<rect x="450" y="170" width="300" height="200" fill="#1a1a1a" stroke="#ff6a00" stroke-width="4"/>
<rect x="450" y="170" width="300" height="8" fill="#ff6a00"/>
<rect x="840" y="170" width="300" height="200" fill="#1a1a1a" stroke="#c1121f" stroke-width="4"/>
<rect x="840" y="170" width="300" height="8" fill="#c1121f"/>
<rect x="450" y="470" width="300" height="170" fill="#1a1a1a" stroke="#c9c9c9" stroke-width="4"/>
<rect x="450" y="470" width="300" height="8" fill="#c9c9c9"/>
<rect x="60" y="690" width="540" height="160" fill="#1a1a1a" stroke="#c1121f" stroke-width="4" stroke-dasharray="14 8"/>
<rect x="60" y="690" width="540" height="8" fill="#c1121f"/>
<rect x="640" y="690" width="500" height="205" fill="#1a1a1a" stroke="#ff6a00" stroke-width="4"/>
<rect x="640" y="690" width="500" height="8" fill="#ff6a00"/>
<path d="M360 250 L450 250" fill="none" stroke="#c9c9c9" stroke-width="3" marker-end="url(#punta)"/>
<path d="M750 250 L840 250" fill="none" stroke="#c9c9c9" stroke-width="3" marker-end="url(#punta)"/>
<path d="M840 320 L750 320" fill="none" stroke="#c9c9c9" stroke-width="3" marker-end="url(#punta)"/>
<path d="M600 370 L600 470" fill="none" stroke="#c9c9c9" stroke-width="3" marker-end="url(#punta)"/>
<path d="M990 370 L990 555 L750 555" fill="none" stroke="#c9c9c9" stroke-width="3" marker-end="url(#punta)"/>
<path d="M450 555 L250 555 L250 370" fill="none" stroke="#c9c9c9" stroke-width="3" marker-end="url(#punta)"/>
<path d="M130 690 L130 370" fill="none" stroke="#c9c9c9" stroke-width="3" marker-end="url(#punta)"/>
<path d="M38 270 L60 270" fill="none" stroke="#c9c9c9" stroke-width="3" marker-end="url(#punta)"/>
<circle cx="28" cy="270" r="8" fill="#ece8e1"/>
</g>
<text x="78" y="212" font-family="Impact, Arial Black, sans-serif" font-size="28" fill="#c9c9c9" letter-spacing="1">DORMIDA</text>
<text x="78" y="246" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Sin persona o &gt; 80 cm</text>
<text x="78" y="274" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Ojos en posición neutra</text>
<text x="78" y="302" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Servos: izq 90° · der 90°</text>
<text x="468" y="212" font-family="Impact, Arial Black, sans-serif" font-size="28" fill="#ff6a00" letter-spacing="1">DESPERTAR</text>
<text x="468" y="246" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Persona a 30–80 cm</text>
<text x="468" y="274" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Ojos cambian lentamente</text>
<text x="468" y="302" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Servos: izq 65° · der 115°</text>
<text x="858" y="212" font-family="Impact, Arial Black, sans-serif" font-size="28" fill="#c1121f" letter-spacing="1">POSESIÓN</text>
<text x="858" y="246" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Persona ≤ 30 cm</text>
<text x="858" y="274" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Movimiento rápido alterno</text>
<text x="858" y="302" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Servos: 45°/135° ↔ 135°/45°</text>
<text x="468" y="512" font-family="Impact, Arial Black, sans-serif" font-size="28" fill="#c9c9c9" letter-spacing="1">CALMA</text>
<text x="468" y="546" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Persona se aleja + 5 s</text>
<text x="468" y="574" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Ojos regresan lentamente</text>
<text x="468" y="602" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Retorno a DORMIDA</text>
<text x="78" y="732" font-family="Impact, Arial Black, sans-serif" font-size="28" fill="#c1121f" letter-spacing="1">LECTURA INVÁLIDA</text>
<text x="78" y="766" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">pulseIn() = 0 → sin eco</text>
<text x="78" y="794" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Posición segura: servos 90° / 90°</text>
<text x="78" y="822" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Estado forzado: DORMIDA</text>
<text x="658" y="732" font-family="Impact, Arial Black, sans-serif" font-size="28" fill="#ff6a00" letter-spacing="1">CIRCUITO · PINES ESP32</text>
<text x="658" y="766" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">HC-SR04 TRIG   → GPIO 5</text>
<text x="658" y="794" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">HC-SR04 ECHO   → GPIO 18</text>
<text x="658" y="822" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Servo izquierdo → GPIO 13</text>
<text x="658" y="850" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">Servo derecho   → GPIO 12</text>
<text x="658" y="878" font-family="Courier New, monospace" font-size="16" fill="#ece8e1" xml:space="preserve">GND común (verificar nivel ECHO)</text>
<text x="405" y="238" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#c9c9c9">≤ 80 cm</text>
<text x="795" y="238" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#c9c9c9">≤ 30 cm</text>
<text x="795" y="342" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#c9c9c9">&gt; 30 cm</text>
<text x="612" y="425" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="#c9c9c9">sin persona · 5 s</text>
<text x="1002" y="460" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="#c9c9c9">se aleja · 5 s</text>
<text x="262" y="470" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="#c9c9c9">regreso lento</text>
<text x="142" y="620" text-anchor="start" font-family="Courier New, monospace" font-size="14" fill="#c9c9c9">falla del sensor</text>
</svg>